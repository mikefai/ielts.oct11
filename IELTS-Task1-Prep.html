t:`Find where a detail (a number, example, definition, reason) appears. NOT in order; one paragraph can hold two answers.`,method:[`Turn each item into a search word: the rarest noun or number.`,`Scan for that word or its synonym; read only that sentence.`,`Same paragraph can answer twice — don't rule it out.`],trap:`Two paragraphs may mention the topic; only one contains the exact detail asked for.`},{n:`6 · Matching Features`,tag:`names → findings`,what:`Match people, dates, or theories (List A) to statements (List B): who discovered X? which theory says Y?`,method:[`Scan for capitalised names first — they are visible anchors.`,`Read 2 sentences around each name; the finding sits beside it.`,`Options may be reused ('may be used more than once') — check instructions.`],trap:`A name mentioned twice: the finding belongs to the sentence where the claim is made, not the first mention.`},{n:`7 · Matching Sentence Endings`,tag:`grammar helps`,what:`Complete sentence beginnings with the correct endings from a box.`,method:[`Read beginnings, predict ending type (cause? result? contrast?).`,`Use grammar: singular/plural, verb forms narrow options fast.`,`Confirm by locating the paraphrased sentence in the text.`],trap:`Two endings fit grammatically — only one matches the text's meaning.`},{n:`8 · Sentence Completion`,tag:`word limit!`,what:`Finish sentences using words from the passage. Instructions like 'NO MORE THAN TWO WORDS' are law.`,method:[`Note the word limit before reading anything.`,`Predict word type: noun? number? adjective?`,`Copy spelling exactly; hyphenated words count as one.`],trap:`Writing three words when two are allowed scores zero even if the meaning is right.`},{n:`9 · Summary / Note / Table / Flow-chart Completion`,tag:`follow the shape`,what:`Fill gaps in a summary of all or part of the passage. May use a word bank or 'words from the text'.`,method:[`Read the summary first — its order follows the passage.`,`Use surrounding words to predict each gap's  ore surrenders barely five grams of metal after crushing, grinding and chemical treatment on an industrial scale — an enterprise that devours energy and water. Set against this, the contents of a tonne of discarded smartphones, holding roughly 300 times more gold alongside palladium concentrations that mine managers would celebrate, look less like rubbish than like the richest deposit never quarried. Whether such grades can be liberated economically is, admittedly, another question entirely; as ore, however, researchers now rank cities above almost anything left in the ground.`,answer:1,why:`A sustained comparison — five grams per tonne of ore versus 300 times more in phones — closing with cities ranked above natural deposits: heading ii. The final 'economically… another question' is an aside pointing at paragraph C, not this paragraph's topic.`},{label:`Paragraph C`,text:`Such grades have bred considerable optimism — and, among engineers, no small impatience with regulators, who have been slow to standardise collection. The impatience is premature. Contemporary devices fuse dozens of elements into millimetre-scale assemblies: shredding them yields a mixed granulate from which separation is costly, while manual disassembly is labour-intensive and exposes workers to lead and brominated flame retardants. Few smelters will accept such feedstock, and those that do charge accordingly. Even the richest urban ore is worthless if unpicking it costs more than its metals — a calculation that currently defeats all but a handful of specialised plants. The obstacle, in short, is not policy but physics and chemistry.`,answer:2,why:`Optimism raised only to be dismissed ('premature'; 'not policy but physics and chemistry'), with three barriers in between — heading iii. The regulators sentence tempts v, but the paragraph explicitly rejects it.`},{label:`Paragraph D`,text:`Conventional metallurgy answers complexity with brute force: furnaces exceeding 1,200°C and baths of acid that themselves become hazardous waste. A quieter alternative has emerged from microbiology. Certain bacteria and fungi naturally leach copper and gold from crushed circuit boards at room temperature, asking only time — weeks rather than hours — in return. Pilot facilities in Finland and Japan have demonstrated that, where electricity is dear or discharge rules stringent, these living reagents can already undercut smelters. Biology, in other words, is beginning to do the work of furnaces.`,answer:3,why:`Furnaces are described only to contrast the microbial alternative (room temperature, pilots undercutting smelters) — heading iv. 'Weeks rather than hours' is a conceded drawback, and concessions are never the main idea.`},{label:`Paragraph E`,text:`Engineers like to credit improving recovery rates to better technology, and technology has indeed advanced. Yet the decisive shifts have come from elsewhere. Landfill bans across the European Union and extended producer-responsibility laws in Japan now compel manufacturers to finance collection networks, while commodity markets furnish the parallel incentive: when lithium prices spiked in 2022, investment in battery recycling tripled within eighteen months — then stalled as prices collapsed again. Innovation opens the door, but law and prices determine who walks through it, and neither driver shows signs of weakening.`,answer:4,why:`Technology is credited then subordinated ('decisive shifts have come from elsewhere') to bans and markets — heading v. The lithium bust illustrates market-driven cycles; it does not argue recycling falls short (vi).`},{label:`Paragraph F`,text:`Recycling's advocates can point to genuine triumphs — lead-acid battery recovery exceeds 95% in regulated markets — but phones are not batteries. Surveys repeatedly find households hoarding obsolete handsets, an estimated 16 billion sitting idle in drawers worldwide, a stockpile recyclers cannot reach, so formal collection rates languish below 25% in most economies. Meanwhile metals demand is projected to double by 2040. Analysts setting the two trajectories side by side conclude that recycling, even perfectly executed, could furnish at most a third of requirements; primary mining, for the foreseeable future, remains unavoidable.`,answer:5,why:`The battery triumph is conceded then contrasted ('but phones are not batteries'); hoarding plus doubling demand lead to the verdict that mining is unavoidable — heading vi. The 95% figure is the concession, not the conclusion.`}],Jo=[{q:`A paragraph opens with evidence FOR urban mining, then 'Nevertheless…' reverses to its limits. The heading should reflect…`,options:[`the opening evidence — first sentences rule`,`the paragraph's overall direction after the turn`,`whichever half shares more words with a heading`],answer:1,explain:`Contrast structures pivot on 'however/nevertheless'. The main idea is where the paragraph ENDS UP, not where it starts — a favourite Band 7+ trap.`},{q:`A statement says 'most researchers agree'. The text says 'several researchers argue'. This is…`,options:[`TRUE — several means most`,`FALSE — quantifier mismatch: several ≠ most`,`NOT GIVEN — we can't count researchers`],answer:1,explain:`'Most' is a claim about the majority; 'several' doesn't support it. Quantifier shifts (some/most/all) flip answers — always compare them exactly.`},{q:`Two headings fit different HALVES of one paragraph (problem + solution). You should…`,options:[`pick the problem heading — problems come first`,`pick whichever half is longer`,`decide which half the paragraph's conclusion serves, and check the other paragraphs first`],answer:2,explain:`Match the paragraph's FUNCTION. And solve easy paragraphs first — elimination often resolves the dilemma for free.`},{q:`The instructions say 'Choose the correct letter A–G'. You…`,options:[`may reuse a letter if two paragraphs match it`,`must use each letter exactly once, leaving spares unused`,`should leave blanks rather than guess`],an n replicated across three countries. Sceptics reply that leafier districts also tend to be wealthier, with superior healthcare access, leaving causation stubbornly unresolved.`,point:`Health claim PLUS the counter-argument (wealth confound) — evaluative territory.`},{label:`Paragraph D`,text:`Legislation has trailed the evidence, and patchily. A handful of councils now prohibit felling above a stipulated trunk diameter, yet exemptions for development remain generous and enforcement budgets thin. The direction of travel, nevertheless, points unmistakably toward preservation.`,point:`Uneven policy today, but overall direction = preservation.`}];function is(){let[e,t]=(0,_.useState)(0),[n,r]=(0,_.useState)(!1),i=[{t:`Step 1 · Skim for structure (2 min)`,task:`Read ONLY the first sentence of each paragraph above. In your head, answer: what is each paragraph FOR?`,why:`A: old view. B: new cooling evidence. C: health evidence + debate. D: policy today. You now own the passage map — most students skip this and drown in detail.`},{t:`Step 2 · Headings by elimination`,task:`Match: A → 'Trees once treated as disposable' · B → 'Measured cooling benefits' · C → 'A contested health claim' · D → 'Uneven but greener policies'. Which was hardest?`,why:`C is hardest: two ideas (claim + criticism). The heading must cover BOTH — any heading mentioning only asthma is a detail-trap.`},{t:`Step 3 · Scan for a number`,task:`Without re-reading: how much less cooling energy did shaded households use? (Answer: 18%.) What did you scan for?`,why:`You scanned for '%' or 'energy' — rare, visible anchors. Numbers and capitals are the fastest scan targets. Answer sits in paragraph B.`},{t:`Step 4 · T/F/NG judgment`,task:`Statement: 'All scientists agree trees reduce asthma.' True, False or Not Given?`,why:`FALSE — paragraph C says causation 'remains debated' and critics disagree. 'All agree' is an absolute the text contradicts. Absolutes (all/never/only) are False-bells.`}][e];return(0,N.jsxs)(`di  Young for unravelling the molecular feedback loops behind such rhythms, work revealing clock genes ticking in nearly every tissue, from liver to skin.`},{label:`Paragraph C`,text:`Epidemiology has linked chronic exposure to harm, most contentiously through night-shift labour. Citing cohort studies of nurses, the International Agency for Research on Cancer classifies night-shift work as 'probably carcinogenic' — Group 2A, reaffirmed in 2019 — yet the associated risks are modest, on the order of a 20% elevation, and entangled with confounders: shift workers smoke more, exercise less and tend to be poorer. Whether light itself, or the lifestyle accompanying it, drives the association remains vigorously disputed.`},{label:`Paragraph D`,text:`Other species fare no better, sometimes worse. Moths spiral around lamps until exhausted; hatchling sea turtles, evolved to scuttle toward moonlit surf, instead wander inland toward coastal glow; dung beetles, which steer by the Milky Way, lose their compass under skyglow. Each mechanism is documented in field experiments, though what these individual misfortunes mean for whole populations is, researchers admit, largely unquantified.`},{label:`Paragraph E`,text:`The current transition to LEDs sharpens every dilemma. Municipalities have halved their lighting energy bills by adopting diodes, accelerating the rollout — yet diode spectra peak precisely in the blue band that most suppresses melatonin and most disorients insects. Remedies exist: shielding that aims light downward, dimming after midnight, amber-shifted lamps. As the physicist Hölker observes, societies could retain illumination while discarding much of its glow; that they rarely do is attributed principally to cost.`},{label:`Paragraph F`,text:`Fundamental uncertainties persist. No regulatory body has fixed a threshold dose below which night-time light is deemed safe, and laboratory exposures typically dwarf real-world levels, limiting how far findings generalise. Sensitivity further varies with age and chronotype — self-described night owls appear somewhat less perturbed. Until longitudinal studies mature, official guidance rests explicitly on precaution rather than proof.`}],ss=[0,1,2,3,4,5],cs=[`A quantifies planetary brightening (four-fifths, 2.2% yearly, satellites vs ground sensors) — heading i. The LED-sensor detail tempts heading v, but lamps are evidence here, not the topic.`,`B explains the retinal–melatonin mechanism and clock genes — heading ii. The Nobel is supporting prestige, not history (vii); therapy (viii) is never mentioned.`,`C weighs shift-work cancer evidence with confounders and dispute — heading iii. The '20% elevation' and 'probably' qualifiers are detail, not the main idea.`,`D catalogues moths, turtles and beetles — harm beyond humans — heading iv. Population effects being 'unquantified' is the paragraph's honest coda, reused in Q10.`,`E contrasts LED savings against blue-spectrum costs plus remedies — heading v. Hölker's quote supports the cost verdict; it is not the paragraph's subject.`,`F inventories unknowns (no threshold, lab-vs-world gap, chronotypes) — heading vi. Precaution-vs-proof is the closing line, not a separate topic.`],ls=[{q:`7. Between 2012 and 2016, lit surfaces worldwide expanded by about 2% per year.`,a:`TRUE`,w:`Paragraph A: 2.2% yearly — 'about 2%' is legitimate approximation. Examiners accept rounded paraphrase as TRUE.`},{q:`8. The 2017 Nobel Prize in Physiology honoured research into nurses' working hours.`,a:`FALSE`,w:`Paragraph B: the prize honoured molecular clockwork (Hall, Rosbash, Young). Nurses appear only in paragraph C's cancer cohorts — a cross-paragraph decoy.`},{q:`9. Scientists have established a precise safe limit for night-time light exposure.`,a:`FALSE`,w:`Paragraph F: no body 'has fixed a threshold dose'. 'Precise safe limit' directly contradicts this.`},{q:`10. Skyglow has been shown to shrink overall moth populations.`,a:`NOT GIVEN`,w:`Paragraph D documents exh
